# Cadenas de la interfaz del tema en castellano.
#
# Las tablas i18n se fusionan por clave, así que un i18n/es.toml en la raíz del
# proyecto puede sobrescribir claves concretas sin duplicar este fichero.
#
# Si falta una clave, Hugo NO falla: cae al idioma por defecto y, si tampoco
# está, devuelve cadena vacía. En silencio. Usa `--printI18nWarnings` (ya
# incluido en los targets `build` y `server` del Makefile) para detectarlo.
#
# Se usan cadenas literales de TOML (comillas simples) para poder incluir
# comillas dobles sin escapes.

