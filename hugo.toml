baseURL = 'https://rats.land/'
defaultContentLanguage = 'es'
# El castellano se sirve en la raíz (/) y el gallego bajo /gl/. Se deja
# explícito porque es una decisión consciente: los `aliases` de Hugo se
# resuelven CON prefijo de idioma y el redirect automático del idioma por
# defecto sólo cubre `/`, así que poner el castellano en /es/ dejaría todas
# las URLs históricas en 404 sin remedio nativo.
defaultContentLanguageInSubdir = false
title = 'rats.land'
# theme = 'hugo-theme-ratsland-sans-serif'  # OJO: sin soporte i18n
theme = 'hugo-theme-ratsland-bookstyle'
enableRobotsTXT = true
enableGitInfo = true

# Con `enableGitInfo` el `lastmod` sale del último commit del fichero. Al mover
# todo el contenido a content/es/ eso pondría la fecha de la migración como
# <lastmod> de las 22 publicaciones en el sitemap; con esta cadena explícita se
# ignora git y se usa el front matter.
[frontmatter]
  lastmod = ['lastmod', 'date']

# Sustituye a la antigua clave `Paginate` (deprecada en Hugo v0.128.0 y ya eliminada).
[pagination]
  pagerSize = 50

# Sustituye a la antigua clave `rssLimit` (deprecada en favor de [services.rss]).
[services.rss]
  limit = 15

[markup.goldmark.renderer]
unsafe = true

[params]
  webRepo = 'https://github.com/1noro/rats.land'
  description = 'rats.land'
  github = 'https://github.com/1noro'
  gitlab = 'https://gitlab.com/1noro'
  mastodon = 'https://tilde.zone/@1noro'
  email = 'inoro@cover.mozmail.com'
  pgpPubKey = 'https://recordratla-public-res.s3.eu-south-2.amazonaws.com/publickey.ppuubblliicc%40protonmail.com.asc'
  articleDefaultImage = 'images/article_default_img_peach.jpg'

  # El antiguo bloque raíz [author] / Site.Author quedó deprecado en Hugo
  # v0.124.0. Ahora el autor vive bajo params y se accede vía
  # .Site.Params.author.name en las plantillas.
  [params.author]
    name = 'Inoro'

# Cada idioma tiene su propio `contentDir`. Son directorios hermanos, no
# solapan (Hugo lo exige) y sustituyen por completo al montaje `content` por
# defecto: cualquier fichero que quedase suelto en content/ sería invisible.
[languages]
  [languages.es]
    # `languageName` quedó deprecada en Hugo v0.158.0; su sustituta es `label`.
    label = 'Castellano'
    # `languageCode` quedó deprecada en Hugo v0.158.0; su sustituta es `locale`.
    locale = 'es-ES'
    weight = 1
    contentDir = 'content/es'
    copyright = 'Esta obra está bajo una Licencia Creative Commons BY-SA-4.0. Y el código HTML y CSS bajo la GNU GPL v3.'

  # Gallego reintegrado (norma AGAL). Se usa el código ISO 639-1 `gl` porque es
  # un tag BCP-47 válido y, por tanto, un `hreflang` que Google respeta; la
  # norma reintegrada se refleja en el texto, no en el código.
  [languages.gl]
    label = 'Galego'
    locale = 'gl-ES'
    weight = 2
    contentDir = 'content/gl'
    copyright = 'Esta obra está sob uma Licença Creative Commons BY-SA-4.0. E o código HTML e CSS sob a GNU GPL v3.'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 1

[taxonomies]
  tag = 'tags'
  # category = 'categories'

[deployment]
# By default, files are uploaded in an arbitrary order.
# Files that match the regular expressions in the "Order" list
# will be uploaded first, in the listed order.
order = [".jpg$", ".gif$"]


[[deployment.targets]]
# An arbitrary name for this target.
name = "s3"
# The Go Cloud Development Kit URL to deploy to. Examples:
# GCS; see https://gocloud.dev/howto/blob/#gcs
# URL = "gs://<Bucket Name>"

# S3; see https://gocloud.dev/howto/blob/#s3
# For S3-compatible endpoints, see https://gocloud.dev/howto/blob/#s3-compatible
# URL = "s3://<Bucket Name>?region=<AWS region>"
URL = "s3://recordratla-public-website?region=eu-south-2"

# Azure Blob Storage; see https://gocloud.dev/howto/blob/#azure
# URL = "azblob://$web"

# You can use a "prefix=" query parameter to target a subfolder of the bucket:
# URL = "gs://<Bucket Name>?prefix=a/subfolder/"

# If you are using a CloudFront CDN, deploy will invalidate the cache as needed.
cloudFrontDistributionID = "E17FZAZTZJJUU1"

# Optionally, you can include or exclude specific files.
# See https://godoc.org/github.com/gobwas/glob#Glob for the glob pattern syntax.
# If non-empty, the pattern is matched against the local path.
# All paths are matched against in their filepath.ToSlash form.
# If exclude is non-empty, and a local or remote file's path matches it, that file is not synced.
# If include is non-empty, and a local or remote file's path does not match it, that file is not synced.
# As a result, local files that don't pass the include/exclude filters are not uploaded to remote,
# and remote files that don't pass the include/exclude filters are not deleted.
# include = "**.html" # would only include files with ".html" suffix
# exclude = "**.{jpg, png}" # would exclude files with ".jpg" or ".png" suffix


# [[deployment.matchers]] configure behavior for files that match the Pattern.
# See https://golang.org/pkg/regexp/syntax/ for pattern syntax.
# Pattern searching is stopped on first match.

# Samples:

[[deployment.matchers]]
# Cache static assets for 1 year.
pattern = "^.+\\.(js|css|svg|ttf)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg|webp)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = false

[[deployment.matchers]]
# Set custom content type for /sitemap.xml
# El patrón casa contra la ruta local, así que sin el `(^|/)` los feeds y
# sitemaps por idioma (gl/index.xml, gl/sitemap.xml) se quedarían fuera y
# perderían el contentType y el gzip.
pattern = "(^|/)(sitemap|index)\\.xml$"
contentType = "application/xml"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(html|xml|json)$"
gzip = true
